# Airpi AP3000M (MT7981B) — Debian 13 路由器默认配置（板级层）
#
# 【层次说明】本文件是**板级参数层**，叠加在 rootfs-overlay/etc/default/router.conf
# （通用骨架）之上。构建时 build-rootfs.sh 先铺通用层、再铺 boards/overlay.d/<board>/，
# 后者同名文件整体覆盖前者。
#
# 由 router-init.service 读取；修改后重启该服务生效。
# 不要在此处修改 NetworkManager/dnsmasq/nftables 的职责归属。

# ---------- 身份 ----------
BOARD_ID=ap3000m
BOARD_NAME=Airpi AP3000M
BOARD_SOC=MT7981B

# ---------- WAN / LAN 物理接口 ----------
# 依据 dts/mt7981b-airpi-ap3000m.dts：gmac0=eth0=LAN(2.5G, 2500base-x → RTL8221B)，
# gmac1=eth1=WAN(1G, 内置 GE PHY)。
# 【依据】ImmortalWrt target/linux/mediatek/filogic/base-files/etc/board.d/02_network
# 中 airpi,ap3000m 与 hiveton,h5000m 共用同一行
#   ucidef_set_interfaces_lan_wan eth0 eth1
# 即两板的 LAN/WAN 角色完全一致。
WAN_IFACE=eth1
LAN_IFACE=eth0
# USB 5G 模组（FM350-GL / MT5700M）接口：NM 独占管理，不由 router-init 建桥
WAN_IFACE_5G=eth2

# ---------- LAN 网桥与网段 ----------
# 按用户决定与 H5000M 保持一致（192.168.88.0/24），便于两板固件共用同一套
# 文档、WebUI 书签与客户端 DHCP 习惯。
LAN_BRIDGE=br-lan
LAN_SUBNET=192.168.88.0/24
LAN_ADDRESS=192.168.88.1/24
LAN_ULA=fd88:88::1/64
DHCP_RANGE=192.168.88.100,192.168.88.200,255.255.255.0,12h

# ---------- Wi-Fi ----------
# MT7981B：**内置** wmac（MT7915 IP，mt7915e 驱动），无 PCIe 端点。
# 双频单芯片同时出 2.4G/5G，接口名为 wlan0 / wlan1
# （mt7915 的 phy0 起两个 vif，命名顺序由 mac80211 决定；若实机顺序相反，
#   只需交换下面两行，无需改代码）。
AP_2G_IFACE=wlan0
AP_5G_IFACE=wlan1
AP_BAND_2G=bg
AP_BAND_5G=a

# 默认 SSID / 密码（2.4G 与 5G 同名；首次登录后请在 WebUI 修改）
#
# 【出厂弱口令，务必修改】AP_PASSWORD 是公开已知的 12345678：
# 任何人搜到本项目就知道你家 Wi-Fi 的口令。本文件被收成 0600（root 可读），
# 但口令本身仍是出厂值，请首次启动后立刻在 WebUI 或本文件里改掉。
# 想让设备首启就自动换成随机口令：把下面的 ROUTER_AP_RANDOMIZE 置为 1，
# 生成结果会写入 /etc/router-initial-credentials（0600）。
AP_SSID_2G=OWRT
AP_SSID_5G=OWRT
AP_PASSWORD=12345678
ROUTER_AP_RANDOMIZE=0

# ---------- 射频 ----------
# MT7981B（中国大陆版）5GHz 支持 36-64 / 100-140 / 149-165，REGULATORY_DOMAIN=CN 完整可用。
REGULATORY_DOMAIN=CN

# ---------- DNS 兜底 ----------
FALLBACK_DNS="1.1.1.1 8.8.8.8 223.5.5.5"

# ---------- 风扇 / PWM ----------
# AP3000M 有两款硬件版本（依据官方 LianXia233/luci-app-airpi3000m-fancontrol）：
#   16GB eMMC → 主板未引出硬件 PWM，风扇挂 GPIO 540，由 airpi-gpio-fan 软 PWM
#               驱动，PWM 节点是全局的 /sys/kernel/duty_cycle
#    8GB eMMC → 硬件 PWM，内核 pwm-fan 驱动导出 hwmon pwm1
#               （上游 DTS：pwm2_pins groups="pwm2"，fan { pwms = <&pwm 2 40000 0>; }，
#                hwmon 名由 SENSORS_PWM_FAN 驱动给出，通常为 pwmfan）
#
# 后端选择与软 PWM 参数在 etc/default/router-fancontrol 的 PWM_BACKEND /
# AIRPI_FAN_* 中配置（本文件只保留与 router-fancontrol 无关的通用项）。
FAN_HWMON_MATCH=pwmfan
