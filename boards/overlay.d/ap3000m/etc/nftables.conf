# Airpi AP3000M (MT7981B) — 唯一防火墙 / NAT 后端（板级层，由 Linux-Router 统一编排）
#
# 【层次说明】叠加在 rootfs-overlay/etc/nftables.conf（通用骨架）之上，整体覆盖。
# 与骨架的唯一差异是表名前缀（router-filter / router-nat 保持不变）——
# 两板共用同一套规则集与 LAN 网段，故内容与骨架一致；
# 保留本文件是为了让"板级层 = 差异所在"这一约定不需要例外。
#
# 规则集本身与网段强耦合：LAN 网段若在板级 router.conf 中改动，
# 本文件的 192.168.88.0/24 必须同步（构建脚本不做跨文件一致性推断）。
# <board> — 唯一防火墙 / NAT 后端（由 Linux-Router 统一编排）
# 规则按接口名生效；接口尚不存在时加载不报错。
#
# 默认策略：
#   input   drop   —— 仅允许 LAN(br-lan)/lo/已建立回程/ICMPv6 必需类型
#   forward drop   —— 仅允许 LAN→WAN 与已建立回程（IPv4 NAT / IPv6 透传）
#   output  accept

flush ruleset

table inet router-filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iifname "lo" accept
		# 【SSH 暴力破解限速】必须在下面的 br-lan 全放行之前：单源 IP 每 10 分钟
		# 最多 20 个新建连接，超出直接丢弃。出厂 root 口令是公开已知值，光靠
		# "只在 LAN 放行" 不够 —— 一旦设备被挂到不可信的二层网络（宾馆/园区网
		# 插错口、桥接被改坏）就没有第二道防线了。已建立的连接不受影响。
		meta nfproto ipv4 tcp dport 22 ct state new meter ssh-limit-v4 { ip saddr timeout 10m limit rate over 20/minute } drop
		meta nfproto ipv6 tcp dport 22 ct state new meter ssh-limit-v6 { ip6 saddr timeout 10m limit rate over 20/minute } drop
		# LAN 管理面：WebUI(80)/SSH(22)/DNS(53)/DHCP(67,68) 均来自 br-lan
		# SSH 仅允许局域网访问（br-lan 放行）；WAN 侧不放行，避免公网暴露
		iifname "br-lan" accept
		# ICMPv6 必需：邻居发现 / 错误消息（否则 WAN IPv6 不可用）
		meta l4proto icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		meta l4proto icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
		meta l4proto icmpv6 icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		# LAN（含 Wi-Fi 客户端）→ WAN
		iifname "br-lan" oifname { "eth1", "eth2" } accept
		# IPv6：允许 LAN 侧转发（ULA→上游，不执行 NAT）
		iifname "br-lan" meta nfproto ipv6 accept
		# 转发路径上的 ICMPv6 必需消息
		meta l4proto icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, packet-too-big, destination-unreachable, time-exceeded } accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# NAT：LAN → WAN Masquerade（IPv4）
table ip router-nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname { "eth1", "eth2" } ip saddr 192.168.88.0/24 masquerade
	}
}
