# Airpi AP3000M (MT7981B) — Wi-Fi 模块显式加载（板级层）
#
# 驱动：mt7915e（mt76 家族，MT7981B **内置** wmac = MT7915 IP，无 PCIe 端点）
# 固件：/usr/lib/firmware/mediatek/mt7981/mt7981_wa.bin + mt7981_rom_patch.bin
#       （EEPROM/校准数据不走固件文件，由 DTS nvmem-cells 从 eMMC factory 分区读取，
#        见 dts/mt7981b-airpi-ap3000m.dts 的 &wifi { nvmem-cells = <&eeprom_factory_0>; }）
#
# 【为什么必须显式列出】同 H5000M 的教训：内置（=y）驱动在根文件系统挂载之前
# probe，固件必然加载不到（-ENOENT），Wi-Fi 每次冷启动都不可用。
# 本板驱动是 mt7915e（=m），由 systemd-modules-load.service 在 rootfs 就位后加载。
#
# 【与 H5000M 的差异】MT7981B 是**平台设备**（platform_device，"mediatek,mt7981-wmac"），
# 不像 MT7992 那样有 PCI modalias 可供 udev 自动匹配。也就是说本文件不是"可选的加速项"，
# 而是 **Wi-Fi 能起来的必要条件** —— 删掉它 MT7981B 的无线不会自动加载。
mt7915e
