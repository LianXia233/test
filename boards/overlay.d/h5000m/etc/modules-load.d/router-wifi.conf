# Hiveton H5000M (MT7987A) — Wi-Fi 模块显式加载（板级层）
#
# 驱动：mt7996e（mt76 家族，PCIe 端点 MT7992）
# 固件：/usr/lib/firmware/mediatek/mt7996/mt7992_{wa,wm,dsp,eeprom,rom_patch}_23.bin
#
# 【为什么必须显式列出，不能只靠 udev 的 PCI modalias 自动加载】
#   1. 让「加载时机」确定、可审计：固件与 regulatory.db 都必须在根文件系统就位后
#      才可读。2026-10-09 实机串口实测过内置（=y）的代价：PCIe 枚举 t=1.064s、
#      mt7996e 请求 mt7992_rom_patch_23.bin 于 t=1.505s，而 `VFS: Mounted root`
#      在 t=1.754s → probe 报 -ENOENT(-2)，Wi-Fi 每次冷启动都不可用。
#      改成 =m + 本文件后由 systemd-modules-load.service 在 rootfs 就位后加载。
#   2. 若某次固件里 mt7996e 又变回内置，本文件顶多是无害的重复加载，不会掩盖问题。
#
# 说明：mt7921e / mt7925e 同属 mt76 家族（亦为 =m），但 H5000M 板载无线只有 MT7992，
#       故不在此列出；无对应硬件的模块不被加载属预期行为。
mt7996e
