# Hiveton H5000M (MT7987A) — Debian 13 路由器默认配置（板级层）
#
# 【层次说明】本文件是**板级参数层**，叠加在 rootfs-overlay/etc/default/router.conf
# （通用骨架）之上。构建时 build-rootfs.sh 先铺通用层、再铺 boards/overlay.d/<board>/，
# 后者同名文件整体覆盖前者。因此这里只写"本板与默认值不同/需要显式声明"的项，
# 同时保留全部键，便于人工比对。
#
# 由 router-init.service 读取；修改后重启该服务生效。
# 不要在此处修改 NetworkManager/dnsmasq/nftables 的职责归属。

# ---------- 身份 ----------
BOARD_ID=h5000m
BOARD_NAME=Hiveton H5000M
BOARD_SOC=MT7987A

# ---------- WAN / LAN 物理接口 ----------
# 依据 dts/mt7987a-hiveton-h5000m.dts：gmac0=eth0=LAN(2.5G)，gmac1=eth1=WAN(1G)
# 与 ImmortalWrt 02_network 的 `ucidef_set_interfaces_lan_wan eth0 eth1` 一致。
WAN_IFACE=eth1
LAN_IFACE=eth0
# USB 5G 模组（MT5700M）接口：NM 独占管理，不由 router-init 建桥
WAN_IFACE_5G=eth2

# ---------- LAN 网桥与网段 ----------
# 与 H5000M 既有部署保持一致，升级不改变 LAN 网段（避免用户端 DHCP 失联）。
LAN_BRIDGE=br-lan
LAN_SUBNET=192.168.88.0/24
LAN_ADDRESS=192.168.88.1/24
LAN_ULA=fd88:88::1/64
DHCP_RANGE=192.168.88.100,192.168.88.200,255.255.255.0,12h

# ---------- Wi-Fi ----------
# MT7987A：PCIe MT7992（mt7996e）。双 PHY → wlan0(2.4G) / wlan1(5G)
AP_2G_IFACE=wlan0
AP_5G_IFACE=wlan1
AP_BAND_2G=bg
AP_BAND_5G=a

# 默认 SSID / 密码（2.4G 与 5G 同名；首次登录后请在 WebUI 修改）
#
# 【出厂弱口令，务必修改】AP_PASSWORD 是公开已知的 12345678：
# 任何人搜到本项目就知道你家 Wi-Fi 的口令。本文件被收成 0600（root 可读），
# 但口令本身仍是出厂值，请首次启动后立刻在 WebUI 或本文件里改掉。
# 想让设备首启就自动换成随机口令：把下面的 ROUTER_AP_RANDOMIZE 置为 1，
# 生成结果会写入 /etc/router-initial-credentials（0600）。
AP_SSID_2G=OWRT
AP_SSID_5G=OWRT
AP_PASSWORD=12345678
ROUTER_AP_RANDOMIZE=0

# ---------- 射频 ----------
REGULATORY_DOMAIN=CN

# ---------- DNS 兜底 ----------
FALLBACK_DNS="1.1.1.1 8.8.8.8 223.5.5.5"

# ---------- 风扇 / PWM ----------
# MT7987A：pwm-fan 经 DT 暴露为 thermal cooling device；hwmon 名为 pwmfan。
# H5000M 走 PWM 通道 2（boards/h5000m.board 的 BOARD_FAN_PWM_CH=2）。
FAN_HWMON_MATCH=pwmfan
