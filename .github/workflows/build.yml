name: H5000M Debian 13 CI 云编译

# 仅手动触发：避免每次提交都占用 runner 时长（每次都是完整固件产出）。
# 需要出包时到 Actions 页面 Run workflow 手动启动，或命令行：gh workflow run build.yml
#
# 【编译提速要点】（详见 docs/build-guide.md §3.7）
#   1. runner 默认 ubuntu-24.04-arm：宿主就是 arm64/aarch64，
#      - RootFS：debootstrap 走 native 模式，免除 qemu-user 二进制翻译（原 67.7 min 大头）；
#      - 内核：本地编译免交叉工具链；
#      - mt5700：cargo 直接宿主目标，免 rustup target add 与交叉 linker。
#   2. ccache 跨运行复用内核编译结果（key 含补丁集/配置/脚本 hash，避免脏命中）；
#   3. 下载层缓存：Debian .deb 归档（--apt-cache-dir）+ debootstrap --cache-dir + cargo registry；
#      （只缓存下载，不缓存构建产物——每次仍真实 dpkg 安装，结果等同无缓存构建）
#   4. --jobs 取 nproc 动态并发；modules 打包走 zstd -T0 多线程。
on:
  workflow_dispatch:
    inputs:
      force_x86_runner:
        description: '回退选项：ARM64 runner 不可用/排队时勾选，改用 x86_64 runner（交叉编译 + qemu 第二阶段，构建显著变慢）'
        required: false
        default: false
        type: boolean

concurrency:
  group: h5000m-build-${{ github.ref }}
  # 手动触发也可能重复点击启动；排队（cancel-in-progress: false）保护正在跑的
  # 长构建不被新 run 杀掉，配合下方 timeout-minutes 防止无限占用 runner。
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  KERNEL_VERSION: 6.18.54
  # ccache 由 build/build-kernel.sh 读取：命中时内核编译从数十分钟降到分钟级
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Debian .deb 下载层缓存目录（仅下载层，由 build-rootfs.sh --apt-cache-dir 消费）
  APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt-debs

jobs:
  # ============================================================ 1. 内核编译
  build-kernel:
    name: 内核 6.18 (MT7987A)
    # 原生 arm64 runner（仓库为 public，GitHub 免费额度内）
    runs-on: ${{ inputs.force_x86_runner && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # native(arm64 runner) 只需 gcc + 内核构建工具；x86_64 回退时补交叉工具链
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev xz-utils zstd ccache \
            u-boot-tools device-tree-compiler curl
          if [[ "$(uname -m)" != "aarch64" && "$(uname -m)" != "arm64" ]]; then
            echo "宿主非 arm64 → 安装交叉工具链（x86 回退路径）"
            sudo apt-get install -y --no-install-recommends crossbuild-essential-arm64
          fi
          echo "宿主架构：$(uname -m)，逻辑核数：$(nproc)"
          ccache --version | head -1

      - name: 缓存内核源码压缩包（只缓存 tar，源码树每次干净解压保证补丁幂等）
        uses: actions/cache@v4
        with:
          path: out/kernel/linux-${{ env.KERNEL_VERSION }}.tar.xz
          key: kernel-tar-${{ env.KERNEL_VERSION }}

      - name: 恢复 ccache（内核编译结果跨运行复用）
        # key 组成：内核版本 + 补丁集/dts/配置/脚本 hash + runner 架构。
        # 任一输入变化即重建缓存，保证不会出现"配置变了但复用旧目标文件"的脏命中。
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.arch }}-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel/patches/**', 'dts/**', 'build/kernel-conf/**', 'build/build-kernel.sh') }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.KERNEL_VERSION }}-

      - name: 初始化 ccache
        run: |
          ccache -M 2G
          ccache -z
          ccache -p 2>/dev/null | head -12 || true

      - name: 编译 Linux 内核（Image / DTB / modules）
        # 不传 --jobs：build-kernel.sh 默认取 nproc 动态并发（原固定 4 在 4 vCPU 上
        # 尚可，留满本机核数更稳）。ccache 命中时本步骤耗时大幅下降。
        run: |
          # 首次失败时打印日志尾部，便于定位是补丁/配置/编译哪一类问题
          set -o pipefail
          bash build/build-kernel.sh \
            --kernel-version "$KERNEL_VERSION" \
            --config build/kernel-conf/h5000m-6.18.config \
            --out out/kernel \
            --strict 2>&1 | tail -n 200
          # pipefail 下 tail 成功不代表 make 成功：显式确认关键产物存在
          for f in Image mt7987a-hiveton-h5000m.dtb modules.tar.zst; do
            [[ -s "out/kernel/$f" ]] || { echo "错误：内核产物缺失 $f"; exit 1; }
          done
          echo "内核产物校验通过："
          ls -lh out/kernel/Image out/kernel/mt7987a-hiveton-h5000m.dtb out/kernel/modules.tar.zst

      - name: 生成 U-Boot 启动脚本 boot.scr
        run: bash build/make-boot.sh --out out/boot

      - name: 整理内核产物为扁平目录
        # upload-artifact@v4 以所有上传路径的公共根为基准保留相对路径：
        # 混合上传 out/kernel/* 与 out/boot/* 时公共根为 out/，artifact 内会保留
        # kernel/ 与 boot/ 子前缀，下游按扁平路径取值即报 cp: cannot stat。
        # 先集中到同一目录再上传，产物在 artifact 内即为扁平文件名。
        run: |
          mkdir -p out/kernel-artifacts
          cp -f \
            out/kernel/Image \
            out/kernel/mt7987a-hiveton-h5000m.dtb \
            out/kernel/modules.tar.zst \
            out/kernel/kernel-config-exported.config \
            out/kernel/kernel-mt7987-options.txt \
            out/boot/boot.scr \
            out/boot/boot.cmd \
            out/kernel-artifacts/
          ls -l out/kernel-artifacts

      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: out/kernel-artifacts/*
          retention-days: 7

  # ============================================================ 2. RootFS + 刷写包
  build-image:
    name: RootFS + 刷写包（FIT / 引导层 ext4 = init + busybox + SquashFS + OverlayFS）
    needs: build-kernel
    runs-on: ${{ inputs.force_x86_runner && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 150
    permissions:
      contents: write   # 上传固件到 GitHub Releases 需要写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # device-tree-compiler：mkimage -f 打包 FIT 时调用外部 dtc 编译 ITS
          #（--no-install-recommends 不会随 u-boot-tools 带入，缺它则 FIT 打包失败）
          # squashfs-tools：mksquashfs 生成只读基础系统（zstd/xz）
          sudo apt-get install -y --no-install-recommends \
            debootstrap rsync zstd xz-utils e2fsprogs u-boot-tools \
            device-tree-compiler squashfs-tools curl patch
          # 仅 x86 回退路径需要：qemu 用户态模拟（RootFS 第二阶段）+ 交叉工具链（mt5700）
          if [[ "$(uname -m)" != "aarch64" && "$(uname -m)" != "arm64" ]]; then
            echo "宿主非 arm64 → 安装 qemu-user-static + binfmt + 交叉工具链（x86 回退路径）"
            sudo apt-get install -y --no-install-recommends \
              qemu-user-static binfmt-support crossbuild-essential-arm64
            sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          fi
          echo "宿主架构：$(uname -m)，逻辑核数：$(nproc)"

      - name: 确保 debootstrap 支持 trixie
        # runner 镜像自带的 debootstrap 若早于 trixie 发布，scripts/ 目录没有
        # trixie 脚本会直接报 "Unknown suite"。此处按需安装 Debian 上游版本，
        # 版本完全匹配时不重复下载（判断为真才执行）。
        run: |
          if ls /usr/share/debootstrap/scripts/trixie >/dev/null 2>&1; then
            echo "debootstrap 已支持 trixie：$(debootstrap --version 2>&1 | head -1)"
            exit 0
          fi
          echo "runner 自带 debootstrap 不含 trixie 脚本，安装 Debian 上游版"
          FN="$(curl -fsSL http://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.xz \
                | xz -d \
                | awk '/^Package: debootstrap$/{f=1} f && /^Filename:/{print $2; exit}')"
          [[ -n "$FN" ]] || { echo "错误：未解析到 debootstrap 包路径"; exit 1; }
          curl -fsSL -o /tmp/debootstrap.deb "http://deb.debian.org/debian/$FN"
          sudo apt-get install -y --no-install-recommends /tmp/debootstrap.deb
          ls /usr/share/debootstrap/scripts/trixie

      - name: 恢复 Debian .deb 下载层缓存
        # 只缓存下载层：命中时 apt/debootstrap 不再重复拉取网络包；安装动作始终
        # 真实执行，产物与无缓存构建完全一致。key 随 packages.list 变化失效。
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-debs-${{ runner.arch }}-trixie-${{ hashFiles('build/rootfs/packages.list') }}

      - name: 恢复 cargo registry 缓存（mt5700 依赖下载层）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('build/build-mt5700.sh') }}

      - name: 下载内核产物
        uses: actions/download-artifact@v4
        with:
          name: kernel-artifacts
          path: artifacts/kernel

      - name: 整理内核目录
        run: |
          mkdir -p out/kernel out/boot
          echo "下载到的内核产物结构："
          find artifacts/kernel -type f | sort
          # 期望扁平结构；若 artifact 意外保留子目录前缀，则按文件名定位兜底
          KART="artifacts/kernel"
          if [[ ! -f "$KART/Image" ]]; then
            KART="$(find artifacts/kernel -type f -name 'Image' -printf '%h\n' -quit)"
            echo "扁平结构未命中，回退到：$KART"
          fi
          [[ -n "$KART" ]] || { echo "错误：artifacts/kernel 下未找到 Image"; exit 1; }
          cp -f "$KART/Image" out/kernel/Image
          cp -f "$KART/mt7987a-hiveton-h5000m.dtb" out/kernel/mt7987a-hiveton-h5000m.dtb
          cp -f "$KART/modules.tar.zst" out/kernel/modules.tar.zst
          cp -f "$KART/boot.scr" out/boot/boot.scr
          cp -f "$KART/boot.cmd" out/boot/boot.cmd
          # 附加产物（配置导出），存在才复制
          [[ -f "$KART/kernel-config-exported.config" ]] && \
            cp -f "$KART/kernel-config-exported.config" out/kernel/kernel-config-exported.config || true
          [[ -f "$KART/kernel-mt7987-options.txt" ]] && \
            cp -f "$KART/kernel-mt7987-options.txt" out/kernel/kernel-mt7987-options.txt || true
          ls -l out/kernel out/boot

      - name: 校验关键内核模块已产出
        # 在 RootFS 构建前校验，避免跑完整轮才发现驱动缺失。
        # 只校验以模块(=m)形式构建的项：5G 模组 USB 栈与 WWAN。
        # 注意：mt7996e / mt76-connac-lib / pwm-fan 在配置中为 =y（编进 vmlinux），
        # 不产生 .ko，由 build-kernel.sh 的 REQUIRED_SYMBOLS 按 .config 校验。
        run: |
          tar -I zstd -tf out/kernel/modules.tar.zst > /tmp/mods.list
          echo "模块总数：$(wc -l < /tmp/mods.list)"
          MISS=0
          for ko in qmi_wwan cdc_mbim option mtk_t7xx; do
            if grep -q "/${ko}\.ko" /tmp/mods.list; then
              echo "  [OK]   ${ko}.ko"
            else
              echo "  [MISS] ${ko}.ko 未编入模块包"
              MISS=1
            fi
          done
          if [[ "$MISS" -ne 0 ]]; then
            echo "错误：关键驱动缺失，请检查内核配置片段（build/kernel-conf/）。"
            echo "模块包内 USB-WWAN 相关条目："
            grep -E "wwan|qmi|mbim|usbserial|option" /tmp/mods.list | head -20
            exit 1
          fi

      - name: 交叉编译 luci-app-mt5700 at-webserver（Debian 分支）
        # 单一 Rust 后端（HTTP API + WebSocket + WebUI 托管，:9000）。
        # 源码固定 commit 保证可复现（见 build/build-mt5700.sh 头注释）。
        # arm64 runner 上为宿主原生目标，无需 --target 与交叉 linker。
        run: |
          # 兜底：GitHub 托管 runner 通常预装 rustup/cargo，缺失时经 rustup.rs 安装
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          bash build/build-mt5700.sh --out out
          ls -lh out/mt5700 out/mt5700/debian
          cat out/mt5700/PROVENANCE.txt

      - name: 构建 Debian 13 RootFS
        # arm64 runner 上 debootstrap 走 native 模式（无 qemu 翻译）；
        # --apt-cache-dir 命中时跳过全部 .deb 下载，install 仍真实执行。
        run: |
          sudo mkdir -p "$APT_CACHE_DIR"
          sudo bash build/build-rootfs.sh \
            --out out \
            --hostname h5000m-debian \
            --kernel-dir out/kernel \
            --mt5700-dir out/mt5700 \
            --skip-tar \
            --apt-cache-dir "$APT_CACHE_DIR"

      - name: 生成只读基础系统 SquashFS（zstd）
        # RootFS 树 → 硬链接副本瘦身（零数据拷贝）→ mksquashfs zstd -19 -b 256K（多核）。
        # 514 MiB 树 ≈ 120 MiB SquashFS（解压速度比 xz 快 5-10 倍，内核已启用 SQUASHFS_ZSTD）。
        run: |
          sudo bash build/make-squashfs.sh --out out --rootfs-dir out/rootfs/rootfs
          ls -lh out/rootfs/rootfs.squashfs

      - name: 生成刷写包（p4 kernel .bin + p5 引导层 .bin，复用现有分区布局）
        # make-sd-image.sh 生成引导层 ext4（init + busybox + SquashFS + overlay 目录），
        # 首启组装 OverlayFS 并扩满 p5（~7.2 GiB）供 /etc /var 持久化；
        # sysupgrade 单文件 ≈ 150 MiB 级（远低于 600 MiB /tmp 内存约束）。
        run: |
          sudo bash build/make-sd-image.sh \
            --out out \
            --kernel-dir out/kernel \
            --squashfs out/rootfs/rootfs.squashfs \
            --boot-dir out/boot

      - name: 封装 sysupgrade-tar 单文件固件（≤600 MiB 内存约束）
        # OpenWrt 标准 sysupgrade-tar 格式（CONTROL + kernel FIT + root 引导层 ext4），
        # 与官方 sysupgrade.bin 同构：目标设备 sysupgrade -n 一条命令完成 p4/p5 写入。
        run: |
          bash build/make-sysupgrade-tar.sh \
            --kernel out/H5000M-debian13-kernel.bin \
            --root out/H5000M-debian13-rootfs.bin \
            --board hiveton_h5000m \
            --out out/H5000M-debian13-sysupgrade.bin
          ls -lh out/H5000M-debian13-sysupgrade.bin

      - name: 修正产物属主（sudo 构建产物 → runner 用户）
        # build-rootfs / make-squashfs / make-sd-image 均以 sudo 运行，产物属主为 root；
        # upload-artifact 以 runner 用户打 zip，读不了 root 0600 文件（旧 run 37353387707
        # 正因 initial-credentials.txt EACCES 失败），上传前统一 chown+放宽读权限。
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          chmod -R u+rwX out
          ls -l out/H5000M-debian13-sysupgrade.bin out/rootfs/initial-credentials.txt

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: h5000m-debian13-release
          path: |
            out/H5000M-debian13-sysupgrade.bin
            out/rootfs/rootfs.squashfs
            out/rootfs/initial-credentials.txt
            out/H5000M-debian13-kernel.bin
            out/H5000M-debian13-rootfs.bin
            out/kernel/Image
            out/kernel/mt7987a-hiveton-h5000m.dtb
            out/kernel/modules.tar.zst
            out/kernel/kernel-config-exported.config
            out/kernel/kernel-mt7987-options.txt
            out/boot/boot.scr
            out/boot/boot.cmd
          retention-days: 14

      - name: 上传固件到 GitHub Releases（参考 OpenWrt 惯例：日期版本 + sha256sums）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(date -u +%y.%m.%d)-r${GITHUB_RUN_NUMBER}"   # e.g. 26.10.06-r43，追加运行序号避免同日重跑覆盖旧 Release
          TAG="H5000M-debian13-${VERSION}"   # 命名带机型（H5000M）+ 版本
          RELEASE_DIR="$GITHUB_WORKSPACE/out/release"
          mkdir -p "$RELEASE_DIR"
          # 主交付：sysupgrade-tar 单文件（~150 MiB 级，sysupgrade -n 一条命令刷写）
          cp -f out/H5000M-debian13-sysupgrade.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-sysupgrade.bin"
          # 分区级刷写产物 + 在线升级用 SquashFS
          cp -f out/H5000M-debian13-kernel.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-kernel.bin"
          cp -f out/H5000M-debian13-rootfs.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.bin"
          cp -f out/rootfs/rootfs.squashfs "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.squashfs"
          cp -f out/rootfs/initial-credentials.txt "$RELEASE_DIR/initial-credentials.txt"
          (cd "$RELEASE_DIR" && sha256sum * > sha256sums.txt)
          cat > "$RELEASE_DIR/RELEASE-NOTES.md" <<EOF
          Hiveton H5000M（MT7987A + eMMC）Debian 13 (Trixie) 刷写包 ${VERSION}（SquashFS + OverlayFS）

          完全复用设备现有 OpenWrt 分区布局与启动链（BL2 / U-Boot / FIP / u-boot-env / factory / GPT / eMMC 硬件配置零改动）。

          ## 方式一（推荐）：sysupgrade 单文件刷写（~150 MiB 级）

          sysupgrade-tar 格式与官方 OpenWrt sysupgrade.bin 同构（板名校验 + dd 写分区），
          整包可完整放入设备 /tmp（tmpfs）。下载后先对照 sha256sums.txt 校验：

              sysupgrade -n -v /tmp/H5000M-debian13-${VERSION}-sysupgrade.bin

          自动流程：板名校验 → kernel FIT dd → p4 → 引导层 ext4 dd → p5 → 重启进 Debian。

          ## 方式二：运行中在线升级（保留全部配置，从已刷 SquashFS + OverlayFS 版本起可用）

              sudo bash scripts/install-emmc.sh \
                --kernel-fit H5000M-debian13-${VERSION}-kernel.bin \
                --rootfs-squashfs H5000M-debian13-${VERSION}-rootfs.squashfs

          仅替换 p5 上的只读 SquashFS + 刷新 p4，/etc /var /opt 等持久化数据不动；
          旧版自动备份为 rootfs.squashfs.bak，重启前 mv 回去即可回退。

          ## 方式三：分区级 dd（initramfs / live 环境全新刷写）

              sudo bash scripts/install-emmc.sh --dev /dev/mmcblk0 \
                --kernel-fit H5000M-debian13-${VERSION}-kernel.bin \
                --rootfs-img H5000M-debian13-${VERSION}-rootfs.bin

          ## 架构说明

          - 只读基础系统：SquashFS（zstd 压缩，~120 MiB）挂在 /sq，由引导层 /sbin/init 组装
          - 可写层：OverlayFS upper/work 位于 p5 引导层 ext4，首启自动扩满 p5（~7.2 GiB），
            /etc /var /opt /服务数据全部持久化，重启保留
          - sysupgrade 整包重写 p5 = 恢复出厂（overlay 旧配置不保留）；保留配置走方式二
          - 主引导 = p4 FIT（现有 U-Boot bootm 流程不变）；首启 WebUI http://192.168.88.1，
            凭据见 initial-credentials.txt（登录后立即改密）
          - p1 u-boot-env / p2 factory / p3 fip 全程不触碰，factory 校准数据安全
          - 本包由 ${{ runner.arch }} runner 构建（native arm64 或 x86 回退路径）

          更多说明：https://github.com/LianXia233/test 仓库 docs/first-boot.md
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "H5000M Debian 13 固件 ${VERSION}" \
            --notes-file "$RELEASE_DIR/RELEASE-NOTES.md"
          echo "已发布 Release：$TAG"
