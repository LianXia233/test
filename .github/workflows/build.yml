name: H5000M Debian 13 CI 云编译

# 仅手动触发：内核编译耗时 1~2 小时，push 自动触发会 burned 大量 runner 时长
# （每次提交都重编一遍几乎不变的内核）。需要出包时到 Actions 页面
# Run workflow 手动启动，或命令行：gh workflow run build.yml
on:
  workflow_dispatch:

concurrency:
  group: h5000m-build-${{ github.ref }}
  # 手动触发也可能重复点击启动；排队（cancel-in-progress: false）保护正在跑的
  # 长构建不被新 run 杀掉，配合下方 timeout-minutes 防止无限占用 runner。
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  KERNEL_VERSION: 6.18.54

jobs:
  # ============================================================ 1. 内核编译
  build-kernel:
    name: 内核 6.18 (MT7987A)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-arm64 bc xz-utils u-boot-tools zstd curl

      - name: 缓存内核源码压缩包（只缓存 tar，源码树每次干净解压保证补丁幂等）
        uses: actions/cache@v4
        with:
          path: out/kernel/linux-${{ env.KERNEL_VERSION }}.tar.xz
          key: kernel-tar-${{ env.KERNEL_VERSION }}

      - name: 编译 Linux 内核（Image / DTB / modules）
        run: |
          bash build/build-kernel.sh \
            --kernel-version "$KERNEL_VERSION" \
            --config build/kernel-conf/h5000m-6.18.config \
            --out out/kernel \
            --jobs 4 \
            --strict

      - name: 生成 U-Boot 启动脚本 boot.scr
        run: bash build/make-boot.sh --out out/boot

      - name: 整理内核产物为扁平目录
        # upload-artifact@v4 以所有上传路径的公共根为基准保留相对路径：
        # 混合上传 out/kernel/* 与 out/boot/* 时公共根为 out/，artifact 内会保留
        # kernel/ 与 boot/ 子前缀，下游按扁平路径取值即报 cp: cannot stat。
        # 先集中到同一目录再上传，产物在 artifact 内即为扁平文件名。
        run: |
          mkdir -p out/kernel-artifacts
          cp -f \
            out/kernel/Image \
            out/kernel/mt7987a-hiveton-h5000m.dtb \
            out/kernel/modules.tar.zst \
            out/kernel/kernel-config-exported.config \
            out/kernel/kernel-mt7987-options.txt \
            out/boot/boot.scr \
            out/boot/boot.cmd \
            out/kernel-artifacts/
          ls -l out/kernel-artifacts

      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: out/kernel-artifacts/*
          retention-days: 7

  # ============================================================ 2. RootFS + 刷写包
  build-image:
    name: RootFS + 刷写包（FIT / ext4，复用现有 eMMC 分区布局）
    needs: build-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write   # 上传固件到 GitHub Releases 需要写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # device-tree-compiler：mkimage -f 打包 FIT 时调用外部 dtc 编译 ITS
          #（--no-install-recommends 不会随 u-boot-tools 带入，缺它则 FIT 打包失败）
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support rsync zstd \
            xz-utils e2fsprogs u-boot-tools device-tree-compiler \
            crossbuild-essential-arm64
          # 确保 qemu-aarch64 binfmt 注册（VM runner 上 binfmt_misc 可用）
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

      - name: 下载内核产物
        uses: actions/download-artifact@v4
        with:
          name: kernel-artifacts
          path: artifacts/kernel

      - name: 整理内核目录
        run: |
          mkdir -p out/kernel out/boot
          echo "下载到的内核产物结构："
          find artifacts/kernel -type f | sort
          # 期望扁平结构；若 artifact 意外保留子目录前缀，则按文件名定位兜底
          KART="artifacts/kernel"
          if [[ ! -f "$KART/Image" ]]; then
            KART="$(find artifacts/kernel -type f -name 'Image' -printf '%h\n' -quit)"
            echo "扁平结构未命中，回退到：$KART"
          fi
          [[ -n "$KART" ]] || { echo "错误：artifacts/kernel 下未找到 Image"; exit 1; }
          cp -f "$KART/Image" out/kernel/Image
          cp -f "$KART/mt7987a-hiveton-h5000m.dtb" out/kernel/mt7987a-hiveton-h5000m.dtb
          cp -f "$KART/modules.tar.zst" out/kernel/modules.tar.zst
          cp -f "$KART/boot.scr" out/boot/boot.scr
          cp -f "$KART/boot.cmd" out/boot/boot.cmd
          # 附加产物（配置导出），存在才复制
          [[ -f "$KART/kernel-config-exported.config" ]] && \
            cp -f "$KART/kernel-config-exported.config" out/kernel/kernel-config-exported.config || true
          [[ -f "$KART/kernel-mt7987-options.txt" ]] && \
            cp -f "$KART/kernel-mt7987-options.txt" out/kernel/kernel-mt7987-options.txt || true
          ls -l out/kernel out/boot

      - name: 校验关键内核模块已产出
        # 在 RootFS 构建前校验，避免跑完整轮才发现驱动缺失。
        # 只校验以模块(=m)形式构建的项：5G 模组 USB 栈与 WWAN。
        # 注意：mt7996e / mt76-connac-lib / pwm-fan 在配置中为 =y（编进 vmlinux），
        # 不产生 .ko，由 build-kernel.sh 的 REQUIRED_SYMBOLS 按 .config 校验。
        run: |
          tar -I zstd -tf out/kernel/modules.tar.zst > /tmp/mods.list
          echo "模块总数：$(wc -l < /tmp/mods.list)"
          MISS=0
          for ko in qmi_wwan cdc_mbim option mtk_t7xx; do
            if grep -q "/${ko}\.ko" /tmp/mods.list; then
              echo "  [OK]   ${ko}.ko"
            else
              echo "  [MISS] ${ko}.ko 未编入模块包"
              MISS=1
            fi
          done
          if [[ "$MISS" -ne 0 ]]; then
            echo "错误：关键驱动缺失，请检查内核配置片段（build/kernel-conf/）。"
            echo "模块包内 USB-WWAN 相关条目："
            grep -E "wwan|qmi|mbim|usbserial|option" /tmp/mods.list | head -20
            exit 1
          fi

      - name: 交叉编译 luci-app-mt5700 at-webserver（Debian 分支）
        # 单一 Rust 后端（HTTP API + WebSocket + WebUI 托管，:9000）。
        # rustls → ring 含 C/asm 代码，默认 aarch64-gnu 交叉编译
        # （gcc-aarch64-linux-gnu，glibc 2.39 ≤ Debian 13 的 2.41 向后兼容）；
        # 源码固定 commit 保证可复现（见 build/build-mt5700.sh 头注释）。
        run: |
          # 兜底：GitHub 托管 runner 通常预装 rustup/cargo，缺失时经 rustup.rs 安装
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          bash build/build-mt5700.sh --out out
          ls -lh out/mt5700 out/mt5700/debian
          cat out/mt5700/PROVENANCE.txt

      - name: 构建 Debian 13 RootFS
        run: |
          sudo bash build/build-rootfs.sh \
            --out out \
            --hostname h5000m-debian \
            --kernel-dir out/kernel \
            --mt5700-dir out/mt5700

      - name: 生成刷写包（p4 kernel .bin + p5 RootFS .bin，复用现有分区布局）
        # make-sd-image.sh 默认开启瘦身模式（apt lists/文档/locale 清理 +
        # 跳过 /boot/Image 冗余副本）+ 注入首启自动扩容服务，rootfs 镜像 540 MiB
        # ——保证 sysupgrade 单文件 ≤600 MiB（整包需进设备 /tmp tmpfs）。
        run: |
          sudo bash build/make-sd-image.sh \
            --out out \
            --kernel-dir out/kernel \
            --rootfs out/rootfs/debian13-arm64-rootfs.tar.zst \
            --boot-dir out/boot

      - name: 封装 sysupgrade-tar 单文件固件（≤600 MiB 内存约束）
        # OpenWrt 标准 sysupgrade-tar 格式（CONTROL + kernel FIT + root ext4），
        # 与官方 sysupgrade.bin 同构：目标设备 sysupgrade -n 一条命令完成 p4/p5 写入。
        run: |
          bash build/make-sysupgrade-tar.sh \
            --kernel out/H5000M-debian13-kernel.bin \
            --root out/H5000M-debian13-rootfs.bin \
            --board hiveton_h5000m \
            --out out/H5000M-debian13-sysupgrade.bin
          ls -lh out/H5000M-debian13-sysupgrade.bin

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: h5000m-debian13-release
          path: |
            out/H5000M-debian13-sysupgrade.bin
            out/rootfs/debian13-arm64-rootfs.tar.zst
            out/rootfs/initial-credentials.txt
            out/H5000M-debian13-kernel.bin
            out/H5000M-debian13-rootfs.bin
            out/kernel/Image
            out/kernel/mt7987a-hiveton-h5000m.dtb
            out/kernel/modules.tar.zst
            out/kernel/kernel-config-exported.config
            out/kernel/kernel-mt7987-options.txt
            out/boot/boot.scr
            out/boot/boot.cmd
          retention-days: 14

      - name: 上传固件到 GitHub Releases（参考 OpenWrt 惯例：日期版本 + sha256sums）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(date -u +%y.%m.%d)-r${GITHUB_RUN_NUMBER}"   # e.g. 26.10.05-r42，追加运行序号避免同日重跑覆盖旧 Release
          TAG="H5000M-debian13-${VERSION}"   # 命名带机型（H5000M）+ 版本
          RELEASE_DIR="$GITHUB_WORKSPACE/out/release"
          mkdir -p "$RELEASE_DIR"
          # 主交付：sysupgrade-tar 单文件（~579 MiB，sysupgrade -n 一条命令刷写）
          cp -f out/H5000M-debian13-sysupgrade.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-sysupgrade.bin"
          # 分区级刷写产物（rootfs 540 MiB < 2 GB 上限，无需 zst 压缩规避）
          cp -f out/H5000M-debian13-kernel.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-kernel.bin"
          cp -f out/H5000M-debian13-rootfs.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.bin"
          cp -f out/rootfs/debian13-arm64-rootfs.tar.zst "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.tar.zst"
          cp -f out/rootfs/initial-credentials.txt "$RELEASE_DIR/initial-credentials.txt"
          (cd "$RELEASE_DIR" && sha256sum * > sha256sums.txt)
          cat > "$RELEASE_DIR/RELEASE-NOTES.md" <<EOF
          Hiveton H5000M（MT7987A + eMMC）Debian 13 (Trixie) 刷写包 ${VERSION}

          完全复用设备现有 OpenWrt 分区布局与启动链（BL2 / U-Boot / FIP / u-boot-env / factory / GPT / eMMC 硬件配置零改动）。

          ## 方式一（推荐）：sysupgrade 单文件刷写

          sysupgrade-tar 格式与官方 OpenWrt sysupgrade.bin 同构（板名校验 + dd 写分区），
          整包 ~579 MiB，可完整放入设备 /tmp（tmpfs）。下载后先对照 sha256sums.txt 校验：

              sysupgrade -n -v /tmp/H5000M-debian13-${VERSION}-sysupgrade.bin

          自动流程：板名校验 → kernel FIT dd → p4 → rootfs ext4 dd → p5 → 重启进 Debian。

          ## 方式二：分区级 dd（大文件经 USB/网络存储中转时）

              sudo bash scripts/install-emmc.sh --dev /dev/mmcblk0 \
                --kernel-fit H5000M-debian13-${VERSION}-kernel.bin \
                --rootfs-img H5000M-debian13-${VERSION}-rootfs.bin

          ## 说明

          - rootfs 镜像为瘦身版 540 MiB（apt 索引/文档/非中英文翻译已清理，功能零损失）；
            **首次启动 h5000m-grow-rootfs.service 自动 resize2fs 扩满 p5（~7.2 GiB）**，GPT 不动
          - 主引导 = p4 FIT（现有 U-Boot bootm 流程不变）；首启 WebUI http://192.168.88.1，
            凭据见 initial-credentials.txt（登录后立即改密）
          - p1 u-boot-env / p2 factory / p3 fip 全程不触碰，factory 校准数据安全
          - 回退 OpenWrt：直接再刷回 OpenWrt sysupgrade.bin 即可

          更多说明：https://github.com/LianXia233/test 仓库 docs/first-boot.md
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "H5000M Debian 13 固件 ${VERSION}" \
            --notes-file "$RELEASE_DIR/RELEASE-NOTES.md"
          echo "已发布 Release：$TAG"
