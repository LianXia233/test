name: H5000M Debian 13 CI 云编译

# 仅手动触发：避免每次提交都占用 runner 时长（每次都是完整固件产出）。
# 需要出包时到 Actions 页面 Run workflow 手动启动，或命令行：gh workflow run build.yml
#
# 【编译提速要点】（详见 docs/build-guide.md §3.7）
#   1. runner 默认 ubuntu-24.04-arm：宿主就是 arm64/aarch64，
#      - RootFS：debootstrap 走 native 模式，免除 qemu-user 二进制翻译（原 67.7 min 大头）；
#      - 内核：本地编译免交叉工具链；
#      - mt5700：cargo 直接宿主目标，免 rustup target add 与交叉 linker。
#   2. ccache 跨运行复用内核编译结果（key 含补丁集/配置/脚本 hash，避免脏命中）；
#   3. 下载层缓存：Debian .deb 归档（--apt-cache-dir）+ debootstrap --cache-dir + cargo registry；
#      （只缓存下载，不缓存构建产物——每次仍真实 dpkg 安装，结果等同无缓存构建）
#   4. --jobs 取 nproc 动态并发；modules 打包走 zstd -T0 多线程。
on:
  workflow_dispatch:
    inputs:
      force_x86_runner:
        description: '回退选项：ARM64 runner 不可用/排队时勾选，改用 x86_64 runner（交叉编译 + qemu 第二阶段，构建显著变慢）'
        required: false
        default: false
        type: boolean
      clear_cache:
        description: '缓存维护：勾选后先清空本仓库全部 Actions 缓存（cache 条目按 key 删除，释放配额并强制下次冷构建）'
        required: false
        default: false
        type: boolean
      skip_release:
        description: '只构建不发布：产物仅上传 Artifact，不创建/覆盖 GitHub Release'
        required: false
        default: false
        type: boolean
      keep_releases:
        description: '历史 Release 保留数量：发布新固件后自动删除更旧的 Release（连同资产与 tag），0 = 不自动清理'
        required: false
        default: '3'
        type: string

# 【最小权限】默认只读；需要写权限的 job（发布 Release、清理缓存）各自单独声明。
permissions:
  contents: read

concurrency:
  group: h5000m-build-${{ github.ref }}
  # 手动触发也可能重复点击启动；排队（cancel-in-progress: false）保护正在跑的
  # 长构建不被新 run 杀掉，配合下方 timeout-minutes 防止无限占用 runner。
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  # 【内核版本锁】固定字面量，禁止改为浮动引用（如 latest/6.x）：
  # 实验差异分析依赖版本确定性（6.18.52 对照 / 6.18.54 修复），升版必须显式
  # 修改此处 + build/build-kernel.sh 默认值 + CHANGELOG 记录三者同步。
  KERNEL_VERSION: 6.18.54
  # ccache 由 build/build-kernel.sh 读取：命中时内核编译从数十分钟降到分钟级
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Debian .deb 下载层缓存目录（仅下载层，由 build-rootfs.sh --apt-cache-dir 消费）
  APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt-debs

jobs:
  # ============================================================ 0a. 缓存维护（可选）
  cache-cleanup:
    name: 清理 Actions 缓存（可选）
    if: ${{ inputs.clear_cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write   # 仅本 job 需要：列出并删除 Actions 缓存条目
    steps:
      - name: 删除本仓库全部 Actions 缓存
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GH_REPO" --limit 100 --json key,sizeInBytes > /tmp/caches.json
          python3 - <<'PY'
          import json
          try:
              caches = json.load(open("/tmp/caches.json"))
          except Exception:
              caches = []
          print(f"当前缓存条目：{len(caches)}")
          for item in caches:
              print(f"  {item.get('key','?')}\t{int(item.get('sizeInBytes',0))//1048576} MiB")
          with open("/tmp/cache-keys.txt", "w", encoding="utf-8") as handle:
              for item in caches:
                  handle.write(f"{item.get('key','')}\n")
          PY
          TOTAL=$(grep -c . /tmp/cache-keys.txt || true)
          if [[ "${TOTAL:-0}" == "0" ]]; then echo "无缓存可清理"; exit 0; fi
          # 逐条删除；单条失败不中断（可能已被并发清理或已过期）
          while read -r KEY; do
            [[ -n "$KEY" ]] || continue
            gh cache delete "$KEY" --repo "$GH_REPO" --yes \
              && echo "  已删除：$KEY" || echo "  跳过（删除失败或已不存在）：$KEY"
          done < /tmp/cache-keys.txt
          echo "缓存清理完成"

  # ============================================================ 0b. 质量门
  quality-gate:
    name: 质量门（语法 / 静态检查 / 单元测试）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装检查工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3 python3-pip python3-flask python3-pyflakes python3-yaml
          python3 -V
          pyflakes --version

      - name: Shell 语法检查（bash -n）
        run: |
          set -uo pipefail
          FAIL=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误：$f"; FAIL=1; }
          done < <(find . -path ./.git -prune -o -type f \( -name '*.sh' \) -print)
          # /usr/local/sbin 下的脚本按 shebang 判定为 sh/bash 的一并校验
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误：$f"; FAIL=1; }
          done < <(find rootfs-overlay/usr/local/sbin -type f 2>/dev/null || true)
          [[ "$FAIL" -eq 0 ]] || { echo "Shell 语法检查未通过"; exit 1; }
          echo "Shell 语法检查通过"

      - name: ShellCheck（告警不计入失败，错误级阻断）
        run: |
          set -uo pipefail
          # 只阻断 error/confirm 级（severity=error）；style/note 级仅提示，避免噪声阻断构建
          while IFS= read -r f; do
            shellcheck --severity=error "$f" || { echo "ShellCheck error：$f"; exit 1; }
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print)
          echo "ShellCheck(error 级) 通过"

      - name: ShellCheck（GitHub Actions 内嵌 run 脚本）
        # workflow 里的 run: 块同样是 shell 代码，但既不在 .sh 文件里、也不被上面
        # 两条find 覆盖，等于静态检查盲区。本步骤用 PyYAML 解析出每个 run 块，
        # 补shebang 后送 shellcheck，避免"CI 里出错的脚本永远查不出来"。
        run: |
          set -uo pipefail
          python3 - <<'PY' > /tmp/embedded-scripts.list
          import pathlib, yaml
          for wf in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              doc = yaml.safe_load(wf.read_text(encoding='utf-8'))
              for jname, job in (doc.get('jobs') or {}).items():
                  for idx, step in enumerate(job.get('steps') or []):
                      script = step.get('run')
                      if not script:
                          continue
                      # 统一按 bash 处理：GitHub Actions 默认 shell 就是 bash -e {0}
                      out = pathlib.Path('/tmp/embedded') / f"{wf.stem}.{jname}.{idx}.sh"
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_text("#!/bin/bash\n" + script, encoding='utf-8')
                      print(out)
          PY
          [[ -s /tmp/embedded-scripts.list ]] || { echo "未解析到内嵌脚本，跳过"; exit 0; }
          COUNT=$(wc -l < /tmp/embedded-scripts.list)
          echo "解析到 $COUNT 段内嵌脚本，逐段ShellCheck"
          FAIL=0
          while IFS= read -r f; do
            # SC2296：${{ runner.arch }} 等 GitHub Actions 表达式在 bash 展开前就已被
            # Actions 引擎替换，shellcheck 看到的是裸字面量，属误报；用 -e 定向排除。
            shellcheck --severity=error -s bash -e SC2296 "$f" \
              || { echo "内嵌脚本 ShellCheck error：$f"; FAIL=1; }
          done < /tmp/embedded-scripts.list
          [[ "$FAIL" -eq 0 ]] || { echo "内嵌脚本 ShellCheck 未通过"; exit 1; }
          echo "内嵌脚本 ShellCheck(error 级) 通过"

      - name: Python 语法检查（py_compile）
        run: |
          python3 -m compileall -q linux-router/vendor scripts || exit 1
          echo "Python 语法检查通过"

      - name: Python 静态检查（pyflakes：未使用导入 / 未定义名）
        # 模块拆分后最容易留下"搬走了但 import 没清"的残留，pyflakes 能一次抓全。
        run: |
          cd linux-router/vendor
          pyflakes router_panel/*.py tests/*.py app.py agent.py
          echo "pyflakes 检查通过"

      - name: Python 单元测试（Linux-Router）
        run: |
          cd linux-router/vendor
          python3 -m pip install --quiet --break-system-packages pytest 2>/dev/null \
            || python3 -m pip install --quiet pytest
          # 跑整个 tests 目录：新增的测试文件（如共享校验、依赖白名单）自动纳入，
          # 不需要每次加文件都回来改 CI。
          PYTHONPATH=. python3 -m pytest tests -q --no-header

      - name: 文件规模守门（仅告警，不阻断）
        # 大文件不会让构建失败，但会让后续改动越来越难。这里只把它显式列出来，
        # 让技术债可见、可追踪，而不是悄悄增长。阈值之上先记录，拆分单独排期。
        run: |
          set -uo pipefail
          SHELL_LIMIT=600
          PY_LIMIT=800
          OVER=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [[ "$lines" -gt "$SHELL_LIMIT" ]]; then
              echo "::warning file=$f::Shell 脚本 ${lines} 行，超过 ${SHELL_LIMIT} 行，建议拆分"
              OVER=1
            fi
          done < <(find . -path ./.git -prune -o -path ./kernel -prune -o -type f \( -name '*.sh' \) -print; find rootfs-overlay/usr/local/sbin -type f 2>/dev/null)
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [[ "$lines" -gt "$PY_LIMIT" ]]; then
              echo "::warning file=$f::Python 模块 ${lines} 行，超过 ${PY_LIMIT} 行，建议拆分"
              OVER=1
            fi
          done < <(find linux-router/vendor/router_panel -type f -name '*.py' 2>/dev/null)
          if [[ "$OVER" -eq 0 ]]; then
            echo "文件规模检查通过（Shell ≤ ${SHELL_LIMIT} 行，Python ≤ ${PY_LIMIT} 行）"
          else
            echo "存在超过阈值的文件（已记录为告警，不阻断构建）"
          fi

      - name: YAML 语法检查（workflow 自身）
        run: |
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML 不可用，跳过"); sys.exit(0)
          bad = 0
          for path in glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
                  print(f"  [OK] {path}")
              except Exception as exc:
                  print(f"  [FAIL] {path}: {exc}"); bad = 1
          sys.exit(bad)
          PY

  # ============================================================ 1. 内核编译
  build-kernel:
    name: 内核 6.18 (MT7987A)
    # 原生 arm64 runner（仓库为 public，GitHub 免费额度内）
    needs: quality-gate
    runs-on: ${{ inputs.force_x86_runner && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # native(arm64 runner) 只需 gcc + 内核构建工具；x86_64 回退时补交叉工具链
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev xz-utils zstd ccache \
            u-boot-tools device-tree-compiler curl
          if [[ "$(uname -m)" != "aarch64" && "$(uname -m)" != "arm64" ]]; then
            echo "宿主非 arm64 → 安装交叉工具链（x86 回退路径）"
            sudo apt-get install -y --no-install-recommends crossbuild-essential-arm64
          fi
          echo "宿主架构：$(uname -m)，逻辑核数：$(nproc)"
          ccache --version | head -1

      - name: 缓存内核源码压缩包（只缓存 tar，源码树每次干净解压保证补丁幂等）
        uses: actions/cache@v5
        with:
          path: out/kernel/linux-${{ env.KERNEL_VERSION }}.tar.xz
          key: kernel-tar-${{ env.KERNEL_VERSION }}

      - name: 恢复 ccache（内核编译结果跨运行复用）
        # key 组成：内核版本 + 补丁集/dts/配置/脚本 hash + runner 架构。
        # 任一输入变化即重建缓存，保证不会出现"配置变了但复用旧目标文件"的脏命中。
        # restore-keys 提供"同版本不同配置"的部分命中（编译大部分目标文件可复用）。
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.arch }}-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel/patches/**', 'dts/**', 'build/kernel-conf/**', 'build/build-kernel.sh') }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.KERNEL_VERSION }}-
            ccache-${{ runner.arch }}-

      - name: 初始化 ccache（含配额与过期清理）
        run: |
          # 上限 2G 并显式设置清理策略：避免 ccache 无限增长占满 runner 磁盘与缓存配额
          ccache -M 2G
          ccache --set-config=max_size=2G
          # 清理超过 30 天未命中的旧对象（ccache 4.x 支持 --evict-older-than）
          ccache --evict-older-than 30d 2>/dev/null || ccache -c 2>/dev/null || true
          ccache -z
          ccache -p 2>/dev/null | head -12 || true

      - name: 编译 Linux 内核（Image / DTB / modules）
        # 不传 --jobs：build-kernel.sh 默认取 nproc 动态并发（原固定 4 在 4 vCPU 上
        # 尚可，留满本机核数更稳）。ccache 命中时本步骤耗时大幅下降。
        run: |
          # 首次失败时打印日志尾部，便于定位是补丁/配置/编译哪一类问题
          set -o pipefail
          bash build/build-kernel.sh \
            --kernel-version "$KERNEL_VERSION" \
            --config build/kernel-conf/h5000m-6.18.config \
            --out out/kernel \
            --strict 2>&1 | tail -n 200
          # pipefail 下 tail 成功不代表 make 成功：显式确认关键产物存在
          for f in Image mt7987a-hiveton-h5000m.dtb modules.tar.zst; do
            [[ -s "out/kernel/$f" ]] || { echo "错误：内核产物缺失 $f"; exit 1; }
          done
          echo "内核产物校验通过："
          ls -lh out/kernel/Image out/kernel/mt7987a-hiveton-h5000m.dtb out/kernel/modules.tar.zst

      - name: 生成 U-Boot 启动脚本 boot.scr
        run: bash build/make-boot.sh --out out/boot

      - name: 整理内核产物为扁平目录
        # upload-artifact@v4 以所有上传路径的公共根为基准保留相对路径：
        # 混合上传 out/kernel/* 与 out/boot/* 时公共根为 out/，artifact 内会保留
        # kernel/ 与 boot/ 子前缀，下游按扁平路径取值即报 cp: cannot stat。
        # 先集中到同一目录再上传，产物在 artifact 内即为扁平文件名。
        run: |
          mkdir -p out/kernel-artifacts
          cp -f \
            out/kernel/Image \
            out/kernel/mt7987a-hiveton-h5000m.dtb \
            out/kernel/modules.tar.zst \
            out/kernel/kernel-config-exported.config \
            out/kernel/kernel-mt7987-options.txt \
            out/boot/boot.scr \
            out/boot/boot.cmd \
            out/kernel-artifacts/
          ls -l out/kernel-artifacts

      - name: 上传内核产物
        uses: actions/upload-artifact@v6
        with:
          name: kernel-artifacts
          path: out/kernel-artifacts/*
          retention-days: 7

  # ============================================================ 2. RootFS + 刷写包
  build-image:
    name: RootFS + 刷写包（FIT / 引导层 ext4 = init + busybox + SquashFS + OverlayFS）
    needs: [quality-gate, build-kernel]
    runs-on: ${{ inputs.force_x86_runner && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 150
    permissions:
      contents: write   # 上传固件到 GitHub Releases 需要写权限（默认顶层为 read，此处按需放开）
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          # device-tree-compiler：mkimage -f 打包 FIT 时调用外部 dtc 编译 ITS
          #（--no-install-recommends 不会随 u-boot-tools 带入，缺它则 FIT 打包失败）
          # squashfs-tools：mksquashfs 生成只读基础系统（zstd/xz）
          sudo apt-get install -y --no-install-recommends \
            debootstrap rsync zstd xz-utils e2fsprogs u-boot-tools \
            device-tree-compiler squashfs-tools curl patch cargo rustc
          # 仅 x86 回退路径需要：qemu 用户态模拟（RootFS 第二阶段）+ 交叉工具链（mt5700）
          if [[ "$(uname -m)" != "aarch64" && "$(uname -m)" != "arm64" ]]; then
            echo "宿主非 arm64 → 安装 qemu-user-static + binfmt + 交叉工具链（x86 回退路径）"
            sudo apt-get install -y --no-install-recommends \
              qemu-user-static binfmt-support crossbuild-essential-arm64
            sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          fi
          echo "宿主架构：$(uname -m)，逻辑核数：$(nproc)"

      - name: 确保 debootstrap 支持 trixie
        # runner 镜像自带的 debootstrap 若早于 trixie 发布，scripts/ 目录没有
        # trixie 脚本会直接报 "Unknown suite"。此处按需安装 Debian 上游版本，
        # 版本完全匹配时不重复下载（判断为真才执行）。
        run: |
          if ls /usr/share/debootstrap/scripts/trixie >/dev/null 2>&1; then
            echo "debootstrap 已支持 trixie：$(debootstrap --version 2>&1 | head -1)"
            exit 0
          fi
          echo "runner 自带 debootstrap 不含 trixie 脚本，安装 Debian 上游版"
          META="$(curl --proto '=https' --tlsv1.2 -fsSL \
            https://deb.debian.org/debian/dists/trixie/main/binary-all/Packages.xz \
            | xz -d \
            | awk 'BEGIN{RS=""; FS="\n"} {pkg=arch=fn=sha=""; for(i=1;i<=NF;i++){if($i=="Package: debootstrap")pkg=1; else if($i=="Architecture: all")arch=1; else if($i ~ /^Filename:/){sub(/^Filename: /,"",$i); fn=$i} else if($i ~ /^SHA256:/){sub(/^SHA256: /,"",$i); sha=$i}} if(pkg&&arch&&fn&&sha){print fn "\t" sha; exit}}')"
          IFS=$'\t' read -r FN EXPECTED_SHA <<< "$META"
          [[ -n "$FN" && "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "错误：未解析到 debootstrap 包路径或 SHA256"; exit 1;
          }
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/debootstrap.deb "https://deb.debian.org/debian/$FN"
          echo "$EXPECTED_SHA  /tmp/debootstrap.deb" | sha256sum -c -
          sudo apt-get install -y --no-install-recommends /tmp/debootstrap.deb
          ls /usr/share/debootstrap/scripts/trixie

      - name: 恢复 Debian .deb 下载层缓存
        # 只缓存下载层：命中时 apt/debootstrap 不再重复拉取网络包；安装动作始终
        # 真实执行，产物与无缓存构建完全一致。
        #
        # key 只取 packages.list 的 hash：真正决定"要下载哪些 .deb"的是这份清单，
        # build-rootfs.sh 只是消费它（不再硬编码额外包）。把构建脚本也放进 key
        # 会导致改一行脚本就整层几百 MB 失效、全部重下。
        # restore-keys 保留宽松前缀，清单小改动时仍能复用上一版的 .deb，
        # 未变更的包继续命中。
        uses: actions/cache@v5
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-debs-${{ runner.arch }}-trixie-${{ hashFiles('build/rootfs/packages.list') }}
          restore-keys: |
            apt-debs-${{ runner.arch }}-trixie-

      - name: 恢复 cargo registry 缓存（mt5700 依赖下载层）
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('build/build-mt5700.sh') }}
          restore-keys: |
            cargo-registry-${{ runner.arch }}-

      - name: 下载内核产物
        uses: actions/download-artifact@v7
        with:
          name: kernel-artifacts
          path: artifacts/kernel

      - name: 整理内核目录
        run: |
          mkdir -p out/kernel out/boot
          echo "下载到的内核产物结构："
          find artifacts/kernel -type f | sort
          # 期望扁平结构；若 artifact 意外保留子目录前缀，则按文件名定位兜底
          KART="artifacts/kernel"
          if [[ ! -f "$KART/Image" ]]; then
            KART="$(find artifacts/kernel -type f -name 'Image' -printf '%h\n' -quit)"
            echo "扁平结构未命中，回退到：$KART"
          fi
          [[ -n "$KART" ]] || { echo "错误：artifacts/kernel 下未找到 Image"; exit 1; }
          cp -f "$KART/Image" out/kernel/Image
          cp -f "$KART/mt7987a-hiveton-h5000m.dtb" out/kernel/mt7987a-hiveton-h5000m.dtb
          cp -f "$KART/modules.tar.zst" out/kernel/modules.tar.zst
          cp -f "$KART/boot.scr" out/boot/boot.scr
          cp -f "$KART/boot.cmd" out/boot/boot.cmd
          # 附加产物（配置导出），存在才复制
          [[ -f "$KART/kernel-config-exported.config" ]] && \
            cp -f "$KART/kernel-config-exported.config" out/kernel/kernel-config-exported.config || true
          [[ -f "$KART/kernel-mt7987-options.txt" ]] && \
            cp -f "$KART/kernel-mt7987-options.txt" out/kernel/kernel-mt7987-options.txt || true
          ls -l out/kernel out/boot

      - name: 校验关键内核模块已产出
        # 在 RootFS 构建前校验，避免跑完整轮才发现驱动缺失。
        # 只校验以模块(=m)形式构建的项：5G 模组 USB 栈与 WWAN。
        # 注意：mt7996e / mt76-connac-lib / pwm-fan 在配置中为 =y（编进 vmlinux），
        # 不产生 .ko，由 build-kernel.sh 的 REQUIRED_SYMBOLS 按 .config 校验。
        run: |
          tar -I zstd -tf out/kernel/modules.tar.zst > /tmp/mods.list
          echo "模块总数：$(wc -l < /tmp/mods.list)"
          MISS=0
          for ko in qmi_wwan cdc_mbim option mtk_t7xx; do
            if grep -q "/${ko}\.ko" /tmp/mods.list; then
              echo "  [OK]   ${ko}.ko"
            else
              echo "  [MISS] ${ko}.ko 未编入模块包"
              MISS=1
            fi
          done
          if [[ "$MISS" -ne 0 ]]; then
            echo "错误：关键驱动缺失，请检查内核配置片段（build/kernel-conf/）。"
            echo "模块包内 USB-WWAN 相关条目："
            grep -E "wwan|qmi|mbim|usbserial|option" /tmp/mods.list | head -20
            exit 1
          fi

      - name: 交叉编译 luci-app-mt5700 at-webserver（Debian 分支）
        # 单一 Rust 后端（HTTP API + WebSocket + WebUI 托管，:9000）。
        # 源码固定 commit 保证可复现（见 build/build-mt5700.sh 头注释）。
        # arm64 runner 上为宿主原生目标，无需 --target 与交叉 linker。
        run: |
          command -v cargo >/dev/null 2>&1 || { echo "错误：cargo 未安装"; exit 1; }
          bash build/build-mt5700.sh --out out
          ls -lh out/mt5700 out/mt5700/debian
          cat out/mt5700/PROVENANCE.txt

      - name: 构建 Debian 13 RootFS
        # arm64 runner 上 debootstrap 走 native 模式（无 qemu 翻译）；
        # --apt-cache-dir 命中时跳过全部 .deb 下载，install 仍真实执行。
        run: |
          sudo mkdir -p "$APT_CACHE_DIR"
          sudo bash build/build-rootfs.sh \
            --out out \
            --hostname h5000m-debian \
            --kernel-dir out/kernel \
            --mt5700-dir out/mt5700 \
            --skip-tar \
            --apt-cache-dir "$APT_CACHE_DIR"

      - name: 生成只读基础系统 SquashFS（zstd）
        # RootFS 树 → 硬链接副本瘦身（零数据拷贝）→ mksquashfs zstd -19 -b 256K（多核）。
        # 514 MiB 树 ≈ 120 MiB SquashFS（解压速度比 xz 快 5-10 倍，内核已启用 SQUASHFS_ZSTD）。
        run: |
          sudo bash build/make-squashfs.sh --out out --rootfs-dir out/rootfs/rootfs
          ls -lh out/rootfs/rootfs.squashfs

      - name: 生成刷写包（p4 kernel .bin + p5 引导层 .bin，复用现有分区布局）
        # make-sd-image.sh 生成引导层 ext4（init + busybox + SquashFS + overlay 目录），
        # 首启组装 OverlayFS 并扩满 p5（~7.2 GiB）供 /etc /var 持久化；
        # sysupgrade 单文件 ≈ 150 MiB 级（远低于 600 MiB /tmp 内存约束）。
        run: |
          sudo bash build/make-sd-image.sh \
            --out out \
            --kernel-dir out/kernel \
            --squashfs out/rootfs/rootfs.squashfs \
            --boot-dir out/boot

      - name: 封装 sysupgrade-tar 单文件固件（≤600 MiB 内存约束）
        # OpenWrt 标准 sysupgrade-tar 格式（CONTROL + kernel FIT + root 引导层 ext4），
        # 与官方 sysupgrade.bin 同构：目标设备 sysupgrade -n 一条命令完成 p4/p5 写入。
        run: |
          bash build/make-sysupgrade-tar.sh \
            --kernel out/H5000M-debian13-kernel.bin \
            --root out/H5000M-debian13-rootfs.bin \
            --board hiveton_h5000m \
            --out out/H5000M-debian13-sysupgrade.bin
          ls -lh out/H5000M-debian13-sysupgrade.bin

      - name: 构建后缓存维护（.deb 下载层瘦身 + apt 清理）
        # 缓存只保留"近期仍在被复用"的 .deb：既避免缓存无限膨胀吃掉 Actions 配额，
        # 又保证常规重跑仍然命中。容量超过上限时按最后访问时间从旧到新淘汰。
        if: always()
        run: |
          set -uo pipefail
          sudo mkdir -p "$APT_CACHE_DIR"
          echo "清理前：$(sudo du -sh "$APT_CACHE_DIR" 2>/dev/null | cut -f1 || echo 未知)"
          # 1) 删除 14 天以上未访问的 .deb
          CLEANED=$(sudo find "$APT_CACHE_DIR" -type f -name '*.deb' -atime +14 -print -delete 2>/dev/null | wc -l)
          echo "已清理过期（>14 天未访问）.deb：$CLEANED 个"
          # 2) 容量上限 1.5 GiB：超限按 atime 从旧到新淘汰
          LIMIT_MB=1536
          CURRENT_MB=$(sudo du -sm "$APT_CACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
          if [[ "${CURRENT_MB:-0}" -gt "$LIMIT_MB" ]]; then
            echo "缓存 ${CURRENT_MB} MiB 超过上限 ${LIMIT_MB} MiB，按访问时间淘汰最旧文件"
            sudo find "$APT_CACHE_DIR" -type f -name '*.deb' -printf '%A@ %p\n' 2>/dev/null \
              | sort -n \
              | while read -r _ts path; do
                  NOW_MB=$(sudo du -sm "$APT_CACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
                  [[ "${NOW_MB:-0}" -le "$LIMIT_MB" ]] && break
                  sudo rm -f "$path"
                done
          fi
          sudo apt-get clean || true
          echo "清理后：$(sudo du -sh "$APT_CACHE_DIR" 2>/dev/null | cut -f1 || echo 未知)"

      - name: ccache 统计与瘦身
        if: always()
        run: |
          command -v ccache >/dev/null 2>&1 && ccache -s || echo "本 job 未使用 ccache"

      - name: 清理中间产物（SquashFS 源树，减少磁盘与后续步骤开销）
        if: always()
        run: |
          # out/rootfs/rootfs 是 500 MiB 级的中间树，SquashFS 已生成，无需保留
          sudo rm -rf out/rootfs/rootfs out/mt5700/src 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" | tail -1 || true

      - name: 修正产物属主（sudo 构建产物 → runner 用户）
        # build-rootfs / make-squashfs / make-sd-image 均以 sudo 运行，产物属主为 root；
        # upload-artifact 以 runner 用户打 zip，读不了 root 0600 文件（旧 run 37353387707
        # 正因 initial-credentials.txt EACCES 失败），上传前统一 chown+放宽读权限。
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          chmod -R u+rwX out
          ls -l out/H5000M-debian13-sysupgrade.bin

      - name: 上传发布产物
        # 【安全】不再上传 initial-credentials.txt：公开仓库的 Artifact 与 Release
        # 对任何人可下载，出厂凭据不应出现在分发物中（凭据仍存在于设备
        # /etc/h5000m-initial-credentials，权限 0600，首启后应立即修改）。
        uses: actions/upload-artifact@v6
        with:
          name: h5000m-debian13-release
          path: |
            out/H5000M-debian13-sysupgrade.bin
            out/rootfs/rootfs.squashfs
            out/H5000M-debian13-kernel.bin
            out/H5000M-debian13-rootfs.bin
            out/kernel/Image
            out/kernel/mt7987a-hiveton-h5000m.dtb
            out/kernel/modules.tar.zst
            out/kernel/kernel-config-exported.config
            out/kernel/kernel-mt7987-options.txt
            out/boot/boot.scr
            out/boot/boot.cmd
          retention-days: 14

      - name: 上传固件到 GitHub Releases（参考 OpenWrt 惯例：日期版本 + sha256sums）
        if: github.event_name != 'pull_request' && !inputs.skip_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(date -u +%y.%m.%d)-r${GITHUB_RUN_NUMBER}"   # e.g. 26.10.06-r43，追加运行序号避免同日重跑覆盖旧 Release
          TAG="H5000M-debian13-${VERSION}"   # 命名带机型（H5000M）+ 版本
          RELEASE_DIR="$GITHUB_WORKSPACE/out/release"
          mkdir -p "$RELEASE_DIR"
          # 主交付：sysupgrade-tar 单文件（~150 MiB 级，sysupgrade -n 一条命令刷写）
          cp -f out/H5000M-debian13-sysupgrade.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-sysupgrade.bin"
          # 分区级刷写产物 + 在线升级用 SquashFS
          cp -f out/H5000M-debian13-kernel.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-kernel.bin"
          cp -f out/H5000M-debian13-rootfs.bin "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.bin"
          cp -f out/rootfs/rootfs.squashfs "$RELEASE_DIR/H5000M-debian13-${VERSION}-rootfs.squashfs"
          # 【安全】不再把 initial-credentials.txt 放进 Release：公开 Release 对任何人
          # 可下载。出厂凭据的说明写入下方 RELEASE-NOTES，实际凭据仍只存在于设备内
          # /etc/h5000m-initial-credentials（0600），首次登录后必须立即修改。
          (cd "$RELEASE_DIR" && sha256sum * > sha256sums.txt)
          cat > "$RELEASE_DIR/RELEASE-NOTES.md" <<EOF
          Hiveton H5000M（MT7987A + eMMC）Debian 13 (Trixie) 刷写包 ${VERSION}（SquashFS + OverlayFS）

          完全复用设备现有 OpenWrt 分区布局与启动链（BL2 / U-Boot / FIP / u-boot-env / factory / GPT / eMMC 硬件配置零改动）。

          ## 方式一（推荐）：sysupgrade 单文件刷写（~150 MiB 级）

          sysupgrade-tar 格式与官方 OpenWrt sysupgrade.bin 同构（板名校验 + dd 写分区），
          整包可完整放入设备 /tmp（tmpfs）。下载后先对照 sha256sums.txt 校验：

              sysupgrade -n -v /tmp/H5000M-debian13-${VERSION}-sysupgrade.bin

          自动流程：板名校验 → kernel FIT dd → p4 → 引导层 ext4 dd → p5 → 重启进 Debian。

          ## 方式二：运行中在线升级（保留全部配置，从已刷 SquashFS + OverlayFS 版本起可用）

              sudo bash scripts/install-emmc.sh \
                --kernel-fit H5000M-debian13-${VERSION}-kernel.bin \
                --rootfs-squashfs H5000M-debian13-${VERSION}-rootfs.squashfs

          仅替换 p5 上的只读 SquashFS + 刷新 p4，/etc /var /opt 等持久化数据不动；
          旧版自动备份为 rootfs.squashfs.bak，重启前 mv 回去即可回退。

          ## 方式三：分区级 dd（initramfs / live 环境全新刷写）

              sudo bash scripts/install-emmc.sh --dev /dev/mmcblk0 \
                --kernel-fit H5000M-debian13-${VERSION}-kernel.bin \
                --rootfs-img H5000M-debian13-${VERSION}-rootfs.bin

          ## 架构说明

          - 只读基础系统：SquashFS（zstd 压缩，~120 MiB）挂在 /sq，由引导层 /sbin/init 组装
          - 可写层：OverlayFS upper/work 位于 p5 引导层 ext4，首启自动扩满 p5（~7.2 GiB），
            /etc /var /opt /服务数据全部持久化，重启保留
          - sysupgrade 整包重写 p5 = 恢复出厂（overlay 旧配置不保留）；保留配置走方式二
          - 主引导 = p4 FIT（现有 U-Boot bootm 流程不变）；首启 WebUI http://192.168.88.1
          - p1 u-boot-env / p2 factory / p3 fip 全程不触碰，factory 校准数据安全
          - 本包由 ${{ runner.arch }} runner 构建（native arm64 或 x86 回退路径）

          ## 首次登录凭据（出厂默认，必须立即修改）

          - WebUI：http://192.168.88.1 用户 admin
          - SSH / 串口：root
          - 默认口令见设备内 /etc/h5000m-initial-credentials（权限 0600，仅本机可读）
          - 本 Release 不附带凭据文件；出厂默认口令为公开已知值，**首次登录后必须立即修改**：
            WebUI「系统 → 安全」改 admin 口令，SSH 内执行 passwd 改 root 口令

          更多说明：https://github.com/LianXia233/test 仓库 docs/first-boot.md
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "H5000M Debian 13 固件 ${VERSION}" \
            --notes-file "$RELEASE_DIR/RELEASE-NOTES.md"
          echo "已发布 Release：$TAG"

      - name: 清理过旧的 Release（保留最近 N 个）
        # 【为什么必须自动清理】每个 Release 含 kernel/rootfs/squashfs/sysupgrade
        # 四个大件，单个约 660 MiB。历史 Release 只增不减会持续吃掉仓库 Release
        # 资产配额（曾堆积到 11 个 / 8.1 GiB），且旧版本固件无回滚价值——真要回退
        # 靠 git checkout 到对应 tag 重新构建更可靠。
        #
        # 【安全设计】
        #   1. 只删"本次发布完成之后仍排在第 N 名之后"的，即按 published_at 倒序
        #      第 N+1 个及更旧的；刚发布的 $TAG 必然在保留集内。
        #   2. skip_release=true 时本步骤整体跳过（没有新Release，凭什么删旧的）。
        #   3. keep_releases 输入非法（非整数/负数）时按"不清理"处理并告警，
        #      避免手滑输入把全部历史 Release 删光。
        #   4. 先删 Release 再删 tag：tag 是 Release 的引用来源，顺序反了会留下
        #      孤儿 tag（GitHub 删除 Release 不会自动清理 tag）。
        #   5. 每次删除都打 ::warning 日志，Actions 页面可见删了什么。
        if: github.event_name != 'pull_request' && !inputs.skip_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP="${INPUT_KEEP_RELEASES:-3}"
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]]; then
            echo "::warning::keep_releases 输入非法（'$KEEP'），本次跳过 Release 清理"
            exit 0
          fi
          if [[ "$KEEP" -eq 0 ]]; then
            echo "keep_releases=0，跳过 Release 清理"
            exit 0
          fi
          # 按发布时间倒序列出全部 Release（API 默认最新在前；不含 draft，避免动未发布草稿）
          mapfile -t ALL_TAGS < <(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq '.[] | select(.draft == false) | .tag_name'
          )
          TOTAL="${#ALL_TAGS[@]}"
          echo "现有正式 Release $TOTAL 个，保留最近 $KEEP 个"
          if [[ "$TOTAL" -le "$KEEP" ]]; then
            echo "无需清理"
            exit 0
          fi
          # 索引 KEEP 之后（即第 KEEP+1 个及更旧）的才是要删的；刚发布的 $TAG 在索引 0，必被保留
          STALE=("${ALL_TAGS[@]:$KEEP}")
          echo "将删除 ${#STALE[@]} 个：${STALE[*]}"
          for T in "${STALE[@]}"; do
            if gh release delete "$T" --repo "$GITHUB_REPOSITORY" --yes; then
              echo "::warning::已删除旧 Release：$T"
            else
              echo "::warning::删除 Release 失败（已跳过）：$T"
              continue
            fi
            # 同步删除 tag：Release 被删后 tag 会变成孤儿，必须显式清掉
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$T" --silent 2>/dev/null; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$T" --silent \
                && echo "::warning::已删除对应 tag：$T" \
                || echo "::warning::删除 tag 失败（已跳过）：$T"
            fi
          done
          echo "== 清理后剩余 Release =="
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | "\(.tag_name)\(if .draft then " [draft]" else "" end)"' || true
