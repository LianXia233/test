name: 构建 AP3000M 固件（Debian 13 / MT7981B）

# ============================================================================
# Airpi AP3000M 专用构建入口（板卡已写死在调用里，无需选择）
#
# 【为什么单独开一个文件，而不是在 build.yml 里选下拉框】
#   1. Actions 侧边栏直接显示「构建 H5000M 固件」与「构建 AP3000M 固件」两条，
#      一眼可见要跑哪个板，不必先点 Run workflow 再在下拉框里挑；
#   2. 并发组、Release tag、Artifact 名天然按板卡隔离，两板可同时构建互不排队；
#   3. 误选板卡的可能性归零 —— 这是真实风险：两板 SoC 不同（MT7987A / MT7981B），
#      内核配置与 DTB 都不同，选错会产出一块砖。
#
# 【实现只有一份】本文件不含任何 job 定义，只是对 build.yml（workflow_call）的
# 薄封装。全部构建逻辑、板级解析、产物打包都在 build.yml 中，改一处两板同时生效。
#
# 【本板状态】内核 job ✅ 已云编译通过；RootFS + 刷写包 job ❌ 失败（待重跑复验）。
# 曾三次失败、三个阶段各不相同：
#   ①② 内核编译（缺 drivers/hwmon/Kconfig 注册 → 修复后 depends 引用了非 Kconfig
#      符号 HRTIMER）—— **均已修复**，run 37843516159（c3f861d）内核 job 已通过；
#   ③  RootFS 构建 —— MT7981 固件「路径 + 清单」双错（路径应为平铺
#      mediatek/mt7981_*.bin 而非子目录；且漏了主固件 mt7981_wm.bin），
#      **已修复，实跑拉取 3/3 成功**，待重跑复验。
# **当前尚无可用产物。** 状态单一真源见 docs/ci-status.md。
#
# 【全仓状态提醒】H5000M 全链路云编译通过，但实机尚未验证 —— 本项目至今没有任何一块
# 板卡完成实机验收，两板产物均**请勿刷机**。
#
# 【本板特有产物】除通用固件外，含 GPIO 软 PWM 风扇驱动 airpi-gpio-fan
# （kernel/files-boards/ap3000m/），构建时在 drivers/hwmon/{Makefile,Kconfig} 双注册。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      force_x86_runner:
        description: '回退选项：ARM64 runner 不可用/排队时勾选，改用 x86_64 runner（交叉编译 + qemu 第二阶段，构建显著变慢）'
        required: false
        default: false
        type: boolean
      skip_release:
        description: '只构建不发布：产物仅上传 Artifact，不创建/覆盖 GitHub Release'
        required: false
        default: false
        type: boolean
      keep_releases:
        description: '本板历史 Release 保留数量：发布新固件后自动删除更旧的（连同资产与 tag），0 = 不自动清理'
        required: false
        default: '3'
        type: string
      clear_cache:
        description: '缓存维护：勾选后先清空本仓库全部 Actions 缓存（注意：会同时清掉 H5000M 的缓存，两板共用缓存池）'
        required: false
        default: false
        type: boolean

# 【权限 —— 这里是真实踩过的坑，务必看完再改】
# workflow_call 的权限取「调用方 ∩ 被调用方」，且**调用方的权限是所有被调用 job 的硬上限**：
# 调用方没声明的权限，在被调用方一律降为 none —— 被调用 job 里写再高的 permissions 也没用。
#
# 本壳最初只声明了 contents: read + job 级 contents: write，结果首次触发即 startup_failure：
#     The nested job 'cache-cleanup' is requesting 'actions: write',
#     but is only allowed 'actions: none'.
# 原因：build.yml 的 cache-cleanup job 需要 actions: write（删除 Actions 缓存），
# 而壳的顶层没声明 actions → 上限为 none → 整个 workflow 在校验阶段就被拒（0 job 创建）。
#
# 因此这里必须把 build.yml 各 job 用到的权限**全部在上限里放开**：
#   actions: write   —— cache-cleanup
#   contents: write  —— build-image 创建/覆盖 Release
# 其余（如 build-kernel / quality-gate）只用默认的 contents: read，无需额外声明。
permissions:
  actions: write
  contents: write

# 【并发 —— 这里也是真实踩过的坑】
# ⚠️ 壳**不要**再声明自己的顶层 concurrency：被调用的 build.yml 顶层已经有
#       group: ${{ inputs.board }}-build-${{ github.ref }}
#   与本壳原来写的 ap3000m-build-${{ github.ref }} 求值完全相同，
#   于是「调用方等在途的被调用方、被调用方等调用方」→ GitHub 判定死锁并取消：
#       Canceling since a deadlock was detected for concurrency group:
#       'ap3000m-build-refs/heads/main' between a top level workflow and 'build'
#
# 结论：**并发控制由基座统一持有**（它已经按 board 隔离，两板互不排队），
# 壳只做 board 钉死与输入透传，不再掺和并发组。

jobs:
  build:
    # 全部实现来自 build.yml；这里只负责把 board 钉死为 ap3000m 并透传用户输入。
    uses: ./.github/workflows/build.yml
    with:
      board: ap3000m
      force_x86_runner: ${{ inputs.force_x86_runner }}
      skip_release: ${{ inputs.skip_release }}
      keep_releases: ${{ inputs.keep_releases }}
      clear_cache: ${{ inputs.clear_cache }}
    # 【注意】job 级 permissions 只能在此**收窄**，放大无效（上限由上面的顶层决定）。
    # 这里保持与顶层一致，避免读者误以为靠 job 级就能提权。若将来要收窄某 job，
    # 在此写更小的权限集即可；但不要在顶层缺失的权限上做文章。
    permissions:
      actions: write
      contents: write
