# <board> — Wi-Fi 模块显式加载（**通用骨架，内容由板级层覆盖**）
#
# 【层次说明】本文件在 rootfs-overlay（通用层）里只是占位说明；实际生效的
# 内容来自 boards/overlay.d/<board>/etc/modules-load.d/router-wifi.conf，
# 因为各板 Wi-Fi 驱动不同（MT7987A=mt7996e / MT7981B=mt7915e）。
#
# 为什么要有这个文件：
#   `build/kernel-conf/<board>-6.18.config` 把 CFG80211 / MAC80211 / mt76 驱动改成了模块（=m），
#   原因是内置（=y）时驱动在根文件系统挂载之前就 probe，固件加载必然失败 —— 2026-10-09
#   实机串口实测：PCIe 枚举 t=1.064s、mt7996e 请求 mt7992_rom_patch_23.bin 于 t=1.505s，
#   而 `VFS: Mounted root` 在 t=1.754s，结果 `mt7996e probe ... failed with error -2`
#   （同一时刻 `cfg80211: failed to load regulatory.db`），Wi-Fi 每次冷启动都不可用。
#
#   改成模块后由 systemd-modules-load.service 在根文件系统就位后加载，固件与
#   regulatory.db（/lib/firmware/regulatory.db，由 wireless-regdb 包提供）均可正常读取。
#
#   这里不依赖 udev 的 PCI modalias 自动加载，是为了让「加载时机」确定、可审计：
#   若某次固件里 mt7996e 又变回内置，本文件顶多是无害的重复加载，不会掩盖问题。
#
# 说明：mt7921e / mt7925e 同属 mt76 家族（亦为 =m），但本板板载无线由
#       boards/<board>.board 的 BOARD_WIFI_MODULES_LOAD 声明，故不在此列出。
#
# 【占位】此处刻意不写任何模块名：通用层不该决定加载哪个驱动。
# 若板级层缺失本文件，systemd-modules-load 会因空文件正常退出（不报错），
# 但 Wi-Fi 需要 udev 按 modalias 兜底自动加载 —— 属可接受的降级。
# 构建脚本会在板级层缺失时给出 WARN（见 build-rootfs.sh 第 6.5 步）。

