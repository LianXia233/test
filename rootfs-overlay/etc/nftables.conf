#!/usr/sbin/nft -f
# Hiveton H5000M — 唯一防火墙 / NAT 后端（由 Linux-Router 统一编排）
# 规则按接口名生效；接口尚不存在时加载不报错。
#
# 默认策略：
#   input   drop   —— 仅允许 LAN(br-lan)/lo/已建立回程/ICMPv6 必需类型
#   forward drop   —— 仅允许 LAN→WAN 与已建立回程（IPv4 NAT / IPv6 透传）
#   output  accept

flush ruleset

table inet h5000m-filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iifname "lo" accept
		# LAN 管理面：WebUI(80)/SSH(22)/DNS(53)/DHCP(67,68) 均来自 br-lan
		# SSH 仅允许局域网访问（br-lan 放行）；WAN 侧不放行，避免公网暴露
		iifname "br-lan" accept
		# ICMPv6 必需：邻居发现 / 错误消息（否则 WAN IPv6 不可用）
		meta l4proto icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		meta l4proto icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
		meta l4proto icmpv6 icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		# LAN（含 Wi-Fi 客户端）→ WAN
		iifname "br-lan" oifname "eth1" accept
		# IPv6：允许 LAN 侧转发（ULA→上游，不执行 NAT）
		iifname "br-lan" meta nfproto ipv6 accept
		# 转发路径上的 ICMPv6 必需消息
		meta l4proto icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, packet-too-big, destination-unreachable, time-exceeded } accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# NAT：LAN → WAN Masquerade（IPv4）
table ip h5000m-nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "eth1" ip saddr 192.168.88.0/24 masquerade
	}
}
