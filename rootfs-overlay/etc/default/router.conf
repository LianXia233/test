# <board> — Debian 13 路由器默认配置（通用骨架）
#
# 【层次说明】本文件是**通用默认层**，下列值对现有板卡（h5000m / ap3000m）恰好一致，
# 可作为兜底。构建时 build-rootfs.sh 会在其之上叠加
# boards/overlay.d/<board>/etc/default/router.conf（板级层，**整体覆盖**本文件）。
# 新增板卡时：若某项与下面不同，只在板级层写差异值，不必改本文件。
#
# 由 router-init.service 读取；修改后重启该服务生效。
# 不要在此处修改 NetworkManager/dnsmasq/nftables 的职责归属。

# ---------- 身份（板级层必须覆盖） ----------
BOARD_ID=""
BOARD_NAME=""
BOARD_SOC=""

# ---------- WAN / LAN 物理接口 ----------
# 两板一致（依据 DTS：gmac0=eth0=LAN，gmac1=eth1=WAN；ImmortalWrt 02_network 中
# airpi,ap3000m 与 hiveton,h5000m 共用 `ucidef_set_interfaces_lan_wan eth0 eth1`）
WAN_IFACE=eth1
LAN_IFACE=eth0
# USB 5G 模组接口（无模组时该项无害）
WAN_IFACE_5G=eth2

# ---------- LAN 网桥与网段 ----------
LAN_BRIDGE=br-lan
LAN_SUBNET=192.168.88.0/24
LAN_ADDRESS=192.168.88.1/24

# LAN IPv6 ULA（dnsmasq 通过 RA 通告；LAN 客户端可自动获取 IPv6，不依赖 WAN PD）
LAN_ULA=fd88:88::1/64

# DHCP 地址池（dnsmasq：192.168.88.100 ~ 200，租约 12h）
DHCP_RANGE=192.168.88.100,192.168.88.200,255.255.255.0,12h

# ---------- Wi-Fi AP 接口 ----------
# 命名约定：wlan0=2.4G / wlan1=5G。MT7996（PCIe，MT7987A）与 MT7915（内置 wmac，
# MT7981B）在 mac80211 下的 vif 命名顺序一致；若实机相反，只需在板级层交换这两行。
AP_2G_IFACE=wlan0
AP_5G_IFACE=wlan1
AP_BAND_2G=bg
AP_BAND_5G=a

# 默认 SSID / 密码（2.4G 与 5G 同名；首次登录后请在 WebUI 修改）
#
# 【出厂弱口令，务必修改】AP_PASSWORD 是公开已知的 12345678：
# 任何人搜到本项目就知道你家 Wi-Fi 的口令。本文件被收成 0600（root 可读），
# 但口令本身仍是出厂值，请首次启动后立刻在 WebUI 或本文件里改掉。
# 想让设备首启就自动换成随机口令：把下面的 ROUTER_AP_RANDOMIZE 置为 1，
# 生成结果会写入 /etc/router-initial-credentials（0600）。
AP_SSID_2G=OWRT
AP_SSID_5G=OWRT
AP_PASSWORD=12345678
ROUTER_AP_RANDOMIZE=0

# 国家/地区（5GHz 信道与发射功率；CN 为完整信道，可按需改 US/DE 等）
REGULATORY_DOMAIN=CN

# dnsmasq 兜底上游 DNS（WAN 未获取到 DNS 时仍可解析）
FALLBACK_DNS="1.1.1.1 8.8.8.8 223.5.5.5"

# ---------- 风扇 / PWM ----------
# hwmon 名称匹配串；pwm-fan 驱动固定暴露为 "pwmfan"（drivers/hwmon/pwm-fan.c）
FAN_HWMON_MATCH=pwmfan
