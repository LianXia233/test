# <board> — dnsmasq 配置（唯一 DHCP + DNS 服务）
# DHCP 与 DNS 均由本实例提供；NetworkManager 已配置 dns=none，不争抢 :53。

# DNS
port=53
domain-needed
bogus-priv
expand-hosts
cache-size=1000

# 仅监听 LAN 网桥与本机（不监听 WAN，避免向公网暴露 DNS）
interface=br-lan
bind-interfaces
listen-address=192.168.88.1,127.0.0.1

# DHCP（LAN 网段，地址池来自 /etc/default/router.conf）
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-range=192.168.88.100,192.168.88.200,255.255.255.0,12h
dhcp-option=option:router,192.168.88.1
dhcp-option=option:dns-server,192.168.88.1
dhcp-option=option:ntp-server,192.168.88.1

# IPv6：RA + 无状态 DHCPv6（通告 br-lan 的 ULA 前缀；不依赖 WAN PD，WAN IPv6 失败不影响 LAN）
enable-ra
dhcp-range=::100,::200,constructor:br-lan,ra-stateless
dhcp-option=option6:dns-server,[fd88:88::1]

# 上游 DNS：由 NM dispatcher（90-router-wan-dns）按 WAN DHCP 结果刷新
no-resolv
resolv-file=/run/router/upstream-resolv.conf

# 兜底上游（WAN 不可用或未获取 DNS 时，LAN 仍可解析）
server=1.1.1.1
server=8.8.8.8
server=223.5.5.5
