; OpenWrtMonitor · ESP32-2432S028R
; ==================================================================
; PlatformIO 工程（Arduino IDE 用户不需要这个文件）
;
; LVGL 版本：9.6.0。配套的 lv_conf.h 就放在工程根目录，
;   靠 build_flags 里的 -DLV_CONF_INCLUDE_SIMPLE + -I . 找到 —— 不用改库目录。
;   （LVGL 9 的显示/输入设备 API 和时钟来源都换了，别随意降回 8.x）
;
; TFT_Touch 不在 PlatformIO 注册表里，先把它放到 lib/ 下：
;   git clone <你的 TFT_Touch 仓库> lib/TFT_Touch
; 或者直接用 Arduino IDE 的库管理器装。
;
; 引脚按 CYD（ESP32-2432S028R）写死在 build_flags 里，
; 这样不用去改 TFT_eSPI 的 User_Setup.h。

[platformio]
default_envs = cyd
; .ino 就在工程根目录，直接让 PIO 从这里找源码
src_dir = .

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Huge APP：3MB app / 1MB SPIFFS。网页 + 图标 + 字体都编进 app
board_build.partitions = huge_app.csv

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I .
    ; ---- TFT_eSPI：CYD 的屏 ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; ---- 投屏：上位机推 JPEG 时需要 JPEG 解码；不装也能编过，
;      只是 :81/draw_image 会回 400，改用 :81/draw_rgb565 或 LZ4 关键帧即可
;      （源码用 __has_include 判断，不存在会自动降级）
lib_deps =
    lvgl/lvgl@^9.6.0
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0
    bodmer/TJpg_Decoder@^1.1.0

; LVGL 9 不再有 LV_TICK_CUSTOM，时钟要代码里显式挂 lv_tick_set_cb()，
;   固件 setup() 里已经挂到 millis()，这里不需要额外开关。
; 字体：ui_font_cn_16.c / ui_font_cn_24.c 在根目录，会被当成普通源码一起编译。
;   两个文件加起来文本有 3MB，实际进 flash 约 354KB（4bpp 抗锯齿），见 README。
;   改了界面文案以后跑一下 tools/check_font.py，确认没有漏字。
